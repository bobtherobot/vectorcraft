# The cursor sync record, written by the /update-cursors skill (.claude/skills/update-cursors).
# Don't edit by hand. One [[cursor]] per cursor or needed section in cursorcraft's folder:
#   id       the cursor's name: its Cursor value (PenAdd), or for a skipped one a name led by
#            its tool; cursorcraft's file name without the extension
#   id_fp    the fingerprint of the cursor's drawing in cursorcraft (absent while status =
#            "needed"; optional when "obsolete")
#   info_fp  its 00-INFO.md description's fingerprint (without the needed marker)
#   status   wired | skipped | needed | obsolete
#   slots    the Cursor variants it draws (wired), or asks for (needed)
#   note     why: the decision and anything the designer clarified
